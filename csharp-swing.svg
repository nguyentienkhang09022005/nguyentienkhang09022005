<svg width="95" height="90" viewBox="0 0 95 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes swingPendulum {
      0% { transform: rotate(14deg); }
      50% { transform: rotate(-14deg); }
      100% { transform: rotate(14deg); }
    }
    @keyframes kickLegs {
      0%, 100% { transform: rotate(-10deg); }
      50% { transform: rotate(15deg); }
    }
    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.1); }
    }
    @keyframes sparkFloat {
      0%, 100% { opacity: 0.3; transform: scale(0.8) translateY(0); }
      50% { opacity: 1; transform: scale(1.1) translateY(-2px); }
    }
    .swing-rig {
      transform-origin: 47.5px 3px;
      animation: swingPendulum 2.8s ease-in-out infinite;
    }
    .legs {
      transform-origin: 47.5px 60px;
      animation: kickLegs 2.8s ease-in-out infinite;
    }
    .eyes {
      transform-origin: 47.5px 33px;
      animation: blink 3.6s infinite;
    }
    .spark {
      animation: sparkFloat 2.2s ease-in-out infinite;
    }
  </style>

  <!-- Complete Swinging Assembly (Hooks + Ropes + Seat + Mascot) -->
  <g class="swing-rig">
    <!-- Top Attachment S-Hooks (Clamped onto the letters of 'Khang') -->
    <!-- Left Hook -->
    <path d="M 31 1 C 28 1 26 3 26 5 C 26 7 28 8 30 8 C 32 8 33 10 33 12 C 33 14 31 15 29 15" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" fill="none" />
    <circle cx="31.5" cy="14" r="2" fill="#64748b" />

    <!-- Right Hook -->
    <path d="M 64 1 C 61 1 59 3 59 5 C 59 7 61 8 63 8 C 65 8 66 10 66 12 C 66 14 64 15 62 15" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" fill="none" />
    <circle cx="64.5" cy="14" r="2" fill="#64748b" />

    <!-- Left & Right Ropes (Twisted nautical rope pattern) -->
    <line x1="31.5" y1="14" x2="31.5" y2="60" stroke="#cbd5e1" stroke-width="1.8" stroke-dasharray="3 1.5" />
    <line x1="64.5" y1="14" x2="64.5" y2="60" stroke="#cbd5e1" stroke-width="1.8" stroke-dasharray="3 1.5" />

    <!-- Swing Wooden Plank -->
    <rect x="23" y="60" width="50" height="5.5" rx="2.5" fill="#78350f" />
    <rect x="25" y="61" width="46" height="3" rx="1.5" fill="#b45309" />
    <rect x="27" y="61.5" width="42" height="1" rx="0.5" fill="#d97706" opacity="0.8" />
    <!-- Rope knots under the seat -->
    <circle cx="31.5" cy="67" r="2.2" fill="#94a3b8" />
    <circle cx="64.5" cy="67" r="2.2" fill="#94a3b8" />

    <!-- Dangling & Kicking Legs -->
    <g class="legs">
      <!-- Left Leg -->
      <rect x="38" y="61" width="6" height="13" rx="3" fill="#7e22ce" />
      <rect x="37" y="70" width="8" height="5" rx="2.5" fill="#4c1d95" />
      <rect x="37" y="73" width="8" height="2" rx="1" fill="#f3e8ff" /> <!-- Sneaker sole -->

      <!-- Right Leg -->
      <rect x="52" y="61" width="6" height="13" rx="3" fill="#7e22ce" />
      <rect x="51" y="70" width="8" height="5" rx="2.5" fill="#4c1d95" />
      <rect x="51" y="73" width="8" height="2" rx="1" fill="#f3e8ff" /> <!-- Sneaker sole -->
    </g>

    <!-- C# Mascot Body (Rounded Hexagonal / Chibi shape) -->
    <!-- Outer Body -->
    <rect x="31" y="38" width="34" height="23" rx="7" fill="#9333ea" />
    <!-- Light Lavender Belly -->
    <rect x="35" y="42" width="26" height="16" rx="5" fill="#f3e8ff" />

    <!-- Authentic C# Logo Badge on Belly: Stylized "C" with "#" inside -->
    <!-- Letter 'C' arc -->
    <path d="M 44 46.5 C 41 46.5 39 48 39 50 C 39 52 41 53.5 44 53.5" stroke="#68217a" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- '#' Symbol inside C -->
    <!-- Vertical bars -->
    <line x1="45" y1="46" x2="45" y2="54" stroke="#7e22ce" stroke-width="1.3" stroke-linecap="round" />
    <line x1="48.5" y1="46" x2="48.5" y2="54" stroke="#7e22ce" stroke-width="1.3" stroke-linecap="round" />
    <!-- Horizontal bars -->
    <line x1="43" y1="48.5" x2="50.5" y2="48.5" stroke="#7e22ce" stroke-width="1.3" stroke-linecap="round" />
    <line x1="43" y1="51.5" x2="50.5" y2="51.5" stroke="#7e22ce" stroke-width="1.3" stroke-linecap="round" />

    <!-- Head -->
    <rect x="29" y="19" width="38" height="23" rx="8" fill="#a855f7" />
    
    <!-- C# Antenna / Cute Top Tuft -->
    <rect x="46" y="12" width="3.5" height="8" rx="1.5" fill="#9333ea" />
    <!-- Antenna Tip with Diamond/Hexagon C# Spark -->
    <circle cx="47.8" cy="11" r="4" fill="#c084fc" />
    <rect x="46" y="9.5" width="3.5" height="3.5" rx="1" fill="#ffffff" transform="rotate(45 47.8 11)" />

    <!-- Cute Ears / Horns -->
    <polygon points="32,21 28,14 36,18" fill="#9333ea" />
    <polygon points="64,21 68,14 60,18" fill="#9333ea" />
    <!-- Inner ear pink -->
    <polygon points="32,20 29.5,15 35,18" fill="#f472b6" opacity="0.7" />
    <polygon points="64,20 66.5,15 61,18" fill="#f472b6" opacity="0.7" />

    <!-- Blushing Cheeks -->
    <circle cx="35" cy="33" r="3" fill="#f472b6" opacity="0.85" />
    <circle cx="61" cy="33" r="3" fill="#f472b6" opacity="0.85" />

    <!-- Sparkly Anime Eyes (Blinking Animation) -->
    <g class="eyes" fill="#1e1b4b">
      <ellipse cx="39" cy="27" rx="3.2" ry="4.2" />
      <ellipse cx="57" cy="27" rx="3.2" ry="4.2" />
      <!-- Big Highlights -->
      <circle cx="38" cy="25.5" r="1.5" fill="#ffffff" />
      <circle cx="56" cy="25.5" r="1.5" fill="#ffffff" />
      <!-- Little Secondary Highlights -->
      <circle cx="40.5" cy="28.5" r="0.8" fill="#ffffff" />
      <circle cx="58.5" cy="28.5" r="0.8" fill="#ffffff" />
    </g>

    <!-- Joyful Smile -->
    <path d="M 44.5 31.5 Q 48 35.5 51.5 31.5" stroke="#1e1b4b" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Little Hands clutching the ropes! -->
    <!-- Left Hand -->
    <circle cx="31.5" cy="46" r="3.2" fill="#c084fc" />
    <circle cx="31.5" cy="46" r="2.2" fill="#e9d5ff" />
    <!-- Right Hand -->
    <circle cx="64.5" cy="46" r="3.2" fill="#c084fc" />
    <circle cx="64.5" cy="46" r="2.2" fill="#e9d5ff" />
  </g>

  <!-- Cute Ambient Sparkles -->
  <g class="spark">
    <path d="M 16 35 L 18 39 L 22 41 L 18 43 L 16 47 L 14 43 L 10 41 L 14 39 Z" fill="#c084fc" opacity="0.6" transform="scale(0.7) translate(8, 10)" />
    <path d="M 78 25 L 80 29 L 84 31 L 80 33 L 78 37 L 76 33 L 72 31 L 76 29 Z" fill="#e0af68" opacity="0.7" transform="scale(0.6) translate(40, 10)" />
  </g>
</svg>