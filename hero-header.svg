<svg width="100%" max-width="600" height="135" viewBox="0 0 600 135" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes waveArm {
      0% { transform: rotate(0deg); }
      20% { transform: rotate(-28deg); }
      40% { transform: rotate(12deg); }
      60% { transform: rotate(-22deg); }
      80% { transform: rotate(8deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes blinkMascot {
      0%, 90%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.1); }
    }
    @keyframes swingPendulum {
      0% { transform: rotate(11deg); }
      50% { transform: rotate(-11deg); }
      100% { transform: rotate(11deg); }
    }
    @keyframes kickLegs {
      0%, 100% { transform: rotate(-10deg); }
      50% { transform: rotate(14deg); }
    }
    @keyframes blinkCSharp {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.1); }
    }
    @keyframes sparkleGlow {
      0%, 100% { opacity: 0.3; transform: scale(0.7); }
      50% { opacity: 1; transform: scale(1.1); }
    }

    .waving-arm {
      transform-origin: 82px 25px;
      animation: waveArm 1.8s ease-in-out infinite;
    }
    .mascot-eyes {
      transform-origin: 73px 19px;
      animation: blinkMascot 4s infinite;
    }

    .swing-assembly {
      transform-origin: 461px 62px;
      animation: swingPendulum 2.6s ease-in-out infinite;
    }
    .csharp-legs {
      transform-origin: 461px 104px;
      animation: kickLegs 2.6s ease-in-out infinite;
    }
    .csharp-eyes {
      transform-origin: 461px 89px;
      animation: blinkCSharp 3.5s infinite;
    }
    .sparkle {
      animation: sparkleGlow 2.5s ease-in-out infinite;
    }
  </style>

  <!-- ========================================== -->
  <!-- 1. COMPACT WAVING MASCOT STANDING ON "Hi" -->
  <!-- ========================================== -->
  <g id="waving-mascot-group">
    <!-- Tail (left) -->
    <rect x="54" y="30" width="4" height="2.5" rx="1" fill="#7dcfff" />
    <rect x="51" y="28.5" width="3.5" height="2.5" rx="1" fill="#7dcfff" />

    <!-- Left & Right Feet: Resting firmly on top bar of the letter "H" (y=39) -->
    <rect x="62" y="37" width="5" height="3.5" rx="1.2" fill="#565f89" />
    <rect x="70" y="37" width="5" height="3.5" rx="1.2" fill="#565f89" />
    <rect x="62" y="39.5" width="5" height="1" rx="0.5" fill="#7dcfff" />
    <rect x="70" y="39.5" width="5" height="1" rx="0.5" fill="#7dcfff" />

    <!-- Body -->
    <rect x="60" y="25" width="16" height="13" rx="3" fill="#7dcfff" />
    <!-- Belly (cyan-white) -->
    <rect x="63" y="27.5" width="10" height="8.5" rx="2" fill="#b4f9f8" />

    <!-- Head -->
    <rect x="58" y="12" width="20" height="14" rx="4" fill="#7dcfff" />

    <!-- Blush Cheeks -->
    <circle cx="61" cy="21" r="1.5" fill="#f7768e" opacity="0.85" />
    <circle cx="75" cy="21" r="1.5" fill="#f7768e" opacity="0.85" />

    <!-- Cute Eyes (Blinking Animation) -->
    <g class="mascot-eyes" fill="#1a1b26">
      <rect x="63.5" y="16" width="2.6" height="4" rx="1.3" />
      <rect x="69.5" y="16" width="2.6" height="4" rx="1.3" />
      <!-- Catchlight Sparkles -->
      <circle cx="64.2" cy="17" r="0.7" fill="#ffffff" />
      <circle cx="70.2" cy="17" r="0.7" fill="#ffffff" />
    </g>

    <!-- Sweet Smile -->
    <path d="M 66 22 Q 68 23.8 70 22" stroke="#1a1b26" stroke-width="1.2" stroke-linecap="round" fill="none" />

    <!-- Left Resting Arm -->
    <rect x="57.5" y="27" width="2.5" height="5.5" rx="1.2" fill="#7dcfff" />

    <!-- Right Arm (Waving!) -->
    <g class="waving-arm">
      <rect x="75" y="24" width="3" height="7" rx="1.2" fill="#7dcfff" transform="rotate(-35 75 24)" />
      <!-- Paw -->
      <rect x="77" y="16.5" width="5" height="6" rx="2" fill="#7dcfff" />
      <circle cx="78.5" cy="16.5" r="0.8" fill="#b4f9f8" />
      <circle cx="80.5" cy="16.5" r="0.8" fill="#b4f9f8" />
    </g>

    <!-- Sparkle beside Hand -->
    <g class="sparkle" fill="#e0af68">
      <rect x="85" y="11" width="1.8" height="4.5" rx="0.9" />
      <rect x="83.6" y="12.3" width="4.5" height="1.8" rx="0.9" />
    </g>
  </g>

  <!-- ========================================== -->
  <!-- 2. MAIN TITLE: "Hi 👋, I'm Nguyen Tien Khang" -->
  <!-- ========================================== -->
  <g id="title-text-group">
    <!-- "Hi" Text -->
    <text x="58" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="33" font-weight="800" fill="#f0f6fc">Hi</text>

    <!-- Vector Waving Hand Emoji 👋 -->
    <g transform="translate(98, 40) scale(0.8)">
      <path d="M 12 18 C 10 14 11 8 15 6 C 17 5 19 6 20 8 L 22 13 L 23 7 C 24 5 26 4 28 6 C 29 7 30 9 29 11 L 28 14 L 30 9 C 31 7 33 7 34 8 C 36 10 35 12 34 14 L 33 17 L 35 13 C 36 11 38 12 39 13 C 40 15 39 17 38 19 C 35 25 32 30 26 31 C 20 32 15 27 13 22 Z" fill="#ffb020" />
      <path d="M 11 18 C 9 17 7 19 8 21 C 10 24 14 26 17 26" stroke="#e09010" stroke-width="1.5" stroke-linecap="round" fill="none" />
      <path d="M 3 10 C 6 8 8 9 9 11" stroke="#7dcfff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />
      <path d="M 1 17 C 4 15 7 16 8 18" stroke="#7dcfff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />
    </g>

    <!-- ", I'm Nguyen Tien" with a distinct 12px space before "Khang" -->
    <text x="127" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="33" font-weight="800" fill="#f0f6fc">, I'm Nguyen Tien<tspan dx="12" fill="#58a6ff">Khang</tspan></text>
  </g>

  <!-- ========================================== -->
  <!-- 3. COMPACT C# MASCOT ON SWING HOOKED INTO "Khang" -->
  <!-- ========================================== -->
  <!-- Metallic S-Hooks looping firmly around the letters of 'Khang' -->
  <!-- Left Hook around 'K' / 'h' -->
  <path d="M 436 57 C 432 57 430 60 430 63 C 430 66 433 68 436 68 C 439 68 440 71 440 74 C 440 77 437 78 434 78" stroke="#cbd5e1" stroke-width="2.2" stroke-linecap="round" fill="none" />
  <circle cx="436" cy="78" r="2" fill="#64748b" />

  <!-- Right Hook around 'g' descender -->
  <path d="M 485 57 C 481 57 479 60 479 63 C 479 66 482 68 485 68 C 488 68 489 71 489 74 C 489 77 486 78 483 78" stroke="#cbd5e1" stroke-width="2.2" stroke-linecap="round" fill="none" />
  <circle cx="485" cy="78" r="2" fill="#64748b" />

  <!-- Complete Swinging Assembly (Pivots at x=461, y=62) -->
  <g class="swing-assembly">
    <!-- Left and Right Ropes -->
    <line x1="436" y1="78" x2="438" y2="106" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="2.5 1.2" />
    <line x1="485" y1="78" x2="483" y2="106" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="2.5 1.2" />

    <!-- Wooden Swing Seat Plank (Compact 56px wide) -->
    <rect x="432" y="106" width="57" height="4.5" rx="2" fill="#78350f" />
    <rect x="434" y="106.8" width="53" height="2.2" rx="1" fill="#b45309" />
    <!-- Rope bottom knots -->
    <circle cx="438" cy="112" r="1.8" fill="#94a3b8" />
    <circle cx="483" cy="112" r="1.8" fill="#94a3b8" />

    <!-- Dangling / Kicking Legs -->
    <g class="csharp-legs">
      <!-- Left Leg -->
      <rect x="450" y="107" width="4.5" height="9.5" rx="1.8" fill="#7e22ce" />
      <rect x="449" y="113.5" width="5.5" height="3.5" rx="1.2" fill="#4c1d95" />
      <rect x="449" y="116" width="5.5" height="1.2" rx="0.6" fill="#f3e8ff" /> <!-- Sneaker sole -->

      <!-- Right Leg -->
      <rect x="465" y="107" width="4.5" height="9.5" rx="1.8" fill="#7e22ce" />
      <rect x="464" y="113.5" width="5.5" height="3.5" rx="1.2" fill="#4c1d95" />
      <rect x="464" y="116" width="5.5" height="1.2" rx="0.6" fill="#f3e8ff" /> <!-- Sneaker sole -->
    </g>

    <!-- C# Mascot Body -->
    <rect x="447" y="91" width="27" height="16" rx="5" fill="#9333ea" />
    <!-- Lavender Belly -->
    <rect x="450.5" y="93.5" width="20" height="11.5" rx="3.5" fill="#f3e8ff" />

    <!-- C# Logo Badge on Belly: Stylized "C" with "#" inside -->
    <path d="M 456.5 97 C 454.7 97 453.5 98.2 453.5 99.5 C 453.5 100.8 454.7 102 456.5 102" stroke="#68217a" stroke-width="1.4" stroke-linecap="round" fill="none" />
    <line x1="458" y1="96.5" x2="458" y2="102.5" stroke="#7e22ce" stroke-width="1.1" stroke-linecap="round" />
    <line x1="460.5" y1="96.5" x2="460.5" y2="102.5" stroke="#7e22ce" stroke-width="1.1" stroke-linecap="round" />
    <line x1="456.5" y1="98.5" x2="462" y2="98.5" stroke="#7e22ce" stroke-width="1.1" stroke-linecap="round" />
    <line x1="456.5" y1="100.5" x2="462" y2="100.5" stroke="#7e22ce" stroke-width="1.1" stroke-linecap="round" />

    <!-- Head -->
    <rect x="446.5" y="77" width="28" height="16" rx="5" fill="#a855f7" />

    <!-- Cute Horns/Ears -->
    <polygon points="448.5,79 445.5,73 452.5,76" fill="#9333ea" />
    <polygon points="472.5,79 475.5,73 468.5,76" fill="#9333ea" />
    <polygon points="448.5,78 446.5,74 451.5,76" fill="#f472b6" opacity="0.8" />
    <polygon points="472.5,78 474.5,74 469.5,76" fill="#f472b6" opacity="0.8" />

    <!-- Cute C# Antenna on Top -->
    <rect x="459.5" y="71" width="2.5" height="6.5" rx="1" fill="#9333ea" />
    <circle cx="460.7" cy="70" r="2.6" fill="#c084fc" />
    <circle cx="460.7" cy="70" r="1.3" fill="#ffffff" />

    <!-- Cheeks Blush -->
    <circle cx="451" cy="87" r="1.8" fill="#f472b6" opacity="0.85" />
    <circle cx="470" cy="87" r="1.8" fill="#f472b6" opacity="0.85" />

    <!-- Big Anime Eyes (Blinking Animation) -->
    <g class="csharp-eyes" fill="#1e1b4b">
      <ellipse cx="454.5" cy="83.5" rx="2.2" ry="2.9" />
      <ellipse cx="466.5" cy="83.5" rx="2.2" ry="2.9" />
      <!-- Sparkles -->
      <circle cx="453.7" cy="82.6" r="0.9" fill="#ffffff" />
      <circle cx="465.7" cy="82.6" r="0.9" fill="#ffffff" />
      <circle cx="455.3" cy="84.5" r="0.5" fill="#ffffff" />
      <circle cx="467.3" cy="84.5" r="0.5" fill="#ffffff" />
    </g>

    <!-- Joyful Smile -->
    <path d="M 458.5 86.5 Q 460.5 89 462.5 86.5" stroke="#1e1b4b" stroke-width="1.3" stroke-linecap="round" fill="none" />

    <!-- Little Hands clutching the ropes -->
    <circle cx="437.5" cy="97" r="2.2" fill="#c084fc" />
    <circle cx="483.5" cy="97" r="2.2" fill="#c084fc" />
  </g>
</svg>