<svg width="200" height="200" viewBox="0 0 200 200"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .line {
      stroke: #00D1FF;
      stroke-width: 2.5;
      fill: none;
      stroke-dasharray: 600;
      stroke-dashoffset: 600;
      animation: draw 2.5s ease forwards;
      filter: url(#glow);
    }

    .orbit {
      stroke: #00D1FF;
      stroke-width: 1.5;
      fill: none;
      stroke-dasharray: 500;
      stroke-dashoffset: 500;
      animation: draw 3s ease forwards;
      filter: url(#glow);
    }

    .circle {
      stroke: #00D1FF;
      stroke-width: 2;
      fill: none;
      stroke-dasharray: 400;
      stroke-dashoffset: 400;
      animation: draw 3s ease forwards;
      filter: url(#glow);
    }

    @keyframes draw {
      to {
        stroke-dashoffset: 0;
      }
    }
  </style>

  <!-- Orbit -->
  <ellipse cx="100" cy="100" rx="80" ry="40" class="orbit"/>
  <ellipse cx="100" cy="100" rx="80" ry="40" transform="rotate(60 100 100)" class="orbit"/>
  <ellipse cx="100" cy="100" rx="80" ry="40" transform="rotate(-60 100 100)" class="orbit"/>

  <!-- Core -->
  <path d="M100 60 L120 100 L100 140 L80 100 Z" class="line"/>

  <!-- Outer -->
  <circle cx="100" cy="100" r="90" class="circle"/>

</svg>